<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Поиск лекарств: быстрый переход к поиску на сайтах аптек." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>АптекаПоиск — поиск лекарств в аптеках</title>
    <script>
      // Применяем тему до загрузки React, чтобы не было «мигания»
      try {
        var s = JSON.parse(localStorage.getItem("pharmacy-finder") || "{}");
        var t = s.state && s.state.theme;
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
